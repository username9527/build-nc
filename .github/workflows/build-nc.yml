name: Cross-Compile Netcat (nc) for ARM32 Soft-Float (armv7l/armv5)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Soft-Float Toolchain & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi \
            make \
            git \
            libbsd-dev

      - name: Build Netcat (nc) statically
        run: |
          # 克隆 Debian 维护的 netcat-openbsd 源码
          git clone --depth 1 https://salsa.debian.org/debian/netcat-openbsd.git netcat-src
          cd netcat-src

          # 使用 arm-linux-gnueabi-gcc 静态编译
          # -static: 强制静态链接 C 库 (glibc/uClibc)
          # -D_GNU_SOURCE: 开启 GNU 扩展以适配 Linux 平台
          arm-linux-gnueabi-gcc -O2 -static -D_GNU_SOURCE \
            -o nc \
            netcat.c atomicio.c socks.c \
            -Wl,-Bstatic

          # 检查编译产物的架构与静态链接属性
          file nc
          cd ..

      - name: Collect & Package Artifacts
        run: |
          mkdir -p output
          cp netcat-src/nc output/
          cd output
          tar -czvf nc-armv5-softfp-static.tar.gz nc

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nc-armv5-softfp-static
          path: output/nc-armv5-softfp-static.tar.gz
