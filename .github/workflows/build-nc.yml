name: Build Static ARM32 Netcat (Soft-Float)

on:
  workflow_dispatch:
    inputs:
      nc_version_note:
        description: '备注：使用 nc110 (classic GNU netcat / netcat-traditional) 源码'
        required: false
        default: 'nc110'
  push:
    paths:
      - '.github/workflows/build-nc.yml'

env:
  # 编译工具链前缀 —— 严格使用 softfp (gnueabi)，禁止 gnueabihf
  CROSS_PREFIX: arm-linux-gnueabi-
  # 兼容 armv5/v6/v7 的通用基线指令集
  ARCH_FLAGS: "-march=armv5t -mfloat-abi=soft -marm"

jobs:
  build-static-nc:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------
      # 1. 安装交叉编译工具链与辅助工具
      # -----------------------------------------------------------
      - name: 安装 ARM32 (softfp) 交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            make \
            wget \
            curl \
            file \
            xxd \
            binutils-arm-linux-gnueabi \
            qemu-user-static \
            qemu-user

      - name: 校验工具链身份（防止误用 gnueabihf）
        run: |
          set -e
          echo "== 编译器版本 =="
          ${CROSS_PREFIX}gcc --version
          echo "== 默认目标三元组 =="
          ${CROSS_PREFIX}gcc -dumpmachine | tee /tmp/target_triple.txt
          if grep -q "gnueabihf" /tmp/target_triple.txt; then
            echo "::error::检测到 gnueabihf (硬浮点) 工具链，与目标设备不匹配！"
            exit 1
          fi
          echo "✅ 确认为 gnueabi (软浮点) 工具链"

      # -----------------------------------------------------------
      # 2. 获取 netcat-traditional (nc110) 源码
      #    主方案：apt-get source（走 Ubuntu 官方 archive，最稳）
      #    备用方案：Debian 归档池直链 + 魔数校验（防止拿到 HTML 跳转页）
      # -----------------------------------------------------------
      - name: 主方案 - 启用 deb-src 并通过 apt 获取源码包
        id: apt_source
        continue-on-error: true
        run: |
          set -e
          mkdir -p src && cd src

          # Ubuntu 24.04 (noble) 使用 deb822 格式 sources 文件；
          # 兼容处理新旧两种格式，确保 deb-src 被启用
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          fi
          sudo apt-get update

          # apt-get source 会自动下载 .orig.tar.gz / .debian.tar.xz 并解包
          apt-get source netcat-traditional

          SRC_DIR=$(find . -maxdepth 1 -type d -name "netcat-traditional-*" | head -n1)
          if [ -z "$SRC_DIR" ]; then
            echo "::error::未找到 netcat-traditional 源码目录"
            exit 1
          fi
          echo "SRC_PATH=${PWD}/${SRC_DIR}" >> "$GITHUB_ENV"
          echo "✅ 源码已就绪（apt 方案）: ${SRC_DIR}"
          ls -la "${SRC_DIR}"

      - name: 备用方案 - 直接从 Debian 归档池下载并做魔数校验
        if: steps.apt_source.outcome == 'failure'
        run: |
          set -e
          mkdir -p src && cd src

          URL="http://deb.debian.org/debian/pool/main/n/netcat-traditional/netcat-traditional_1.10.orig.tar.gz"
          echo "尝试从备用地址下载: ${URL}"
          curl -L --retry 3 --fail -o nc110.tgz "$URL"

          # 校验文件头是否为 gzip 魔数 (1f 8b)，而不是 HTML 跳转页
          MAGIC=$(xxd -p -l2 nc110.tgz)
          if [ "$MAGIC" != "1f8b" ]; then
            echo "::error::下载内容不是合法 gzip 文件（魔数=${MAGIC}），可能拿到了 HTML 页面"
            echo "----- 文件内容预览 -----"
            head -c 300 nc110.tgz
            exit 1
          fi

          tar xzf nc110.tgz
          SRC_DIR=$(find . -maxdepth 1 -type d -name "netcat-traditional-*" | head -n1)
          if [ -z "$SRC_DIR" ]; then
            echo "::error::解压后未找到源码目录"
            exit 1
          fi
          echo "SRC_PATH=${PWD}/${SRC_DIR}" >> "$GITHUB_ENV"
          echo "✅ 源码已就绪（备用方案）: ${SRC_DIR}"
          ls -la "${SRC_DIR}"

      - name: 校验源码路径最终有效
        run: |
          if [ -z "${SRC_PATH}" ] || [ ! -f "${SRC_PATH}/netcat.c" ]; then
            echo "::error::未能定位到 netcat.c，源码获取彻底失败"
            exit 1
          fi
          echo "最终源码路径: ${SRC_PATH}"

      # -----------------------------------------------------------
      # 3. 交叉编译（全静态 + 架构兼容 flags）
      # -----------------------------------------------------------
      - name: 交叉编译 nc（全静态链接）
        run: |
          set -e
          cd "${SRC_PATH}"
          ls -la

          ${CROSS_PREFIX}gcc \
            ${ARCH_FLAGS} \
            -Os \
            -static \
            -DTELNET \
            -DGAPING_SECURITY_HOLE \
            -Wall \
            -o nc \
            netcat.c

          # 去除符号表，减小体积（不影响静态特性）
          ${CROSS_PREFIX}strip -s nc

          cp nc "${GITHUB_WORKSPACE}/nc"

      # -----------------------------------------------------------
      # 4. 验证二进制属性：架构 / ABI / 静态链接
      # -----------------------------------------------------------
      - name: 验证二进制文件属性 (file / readelf)
        run: |
          set -e
          echo "===== file 输出 ====="
          file ./nc

          echo ""
          echo "===== readelf 动态段检查（应无 NEEDED 条目）====="
          if readelf -d ./nc 2>&1 | grep -i "NEEDED"; then
            echo "::error::检测到动态依赖，静态链接失败！"
            exit 1
          else
            echo "✅ 未发现动态依赖，确认为纯静态二进制"
          fi

          echo ""
          echo "===== EABI / 浮点属性检查 ====="
          readelf -A ./nc | grep -i "Float\|Tag_ABI" || true

          # 强校验：文件描述必须同时包含 ARM 架构 与 statically linked
          FILE_OUT=$(file ./nc)
          echo "$FILE_OUT" | grep -q "ARM" || { echo "::error::非 ARM 架构"; exit 1; }
          echo "$FILE_OUT" | grep -qi "statically linked" || { echo "::error::非静态链接"; exit 1; }
          echo "✅ 架构与链接方式校验通过"

      # -----------------------------------------------------------
      # 5. 使用 QEMU 用户态模拟，实际执行验证（避免 Illegal instruction）
      # -----------------------------------------------------------
      - name: QEMU 模拟执行冒烟测试
        run: |
          set -e
          chmod +x ./nc
          echo "===== 使用 qemu-arm-static 执行 nc -h ====="
          qemu-arm-static ./nc -h || {
            echo "::error::QEMU 模拟执行失败，二进制可能存在指令集不兼容问题"
            exit 1
          }
          echo "✅ 模拟执行成功，未触发 Illegal instruction"

      # -----------------------------------------------------------
      # 6. 打包并上传 Artifact
      # -----------------------------------------------------------
      - name: 打包产物
        run: |
          set -e
          mkdir -p dist
          cp ./nc dist/nc-arm32-softfp-static
          cd dist
          sha256sum nc-arm32-softfp-static > nc-arm32-softfp-static.sha256
          tar czf nc-arm32-softfp-static.tar.gz nc-arm32-softfp-static nc-arm32-softfp-static.sha256
          ls -la

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nc-arm32-softfp-static
          path: |
            dist/nc-arm32-softfp-static
            dist/nc-arm32-softfp-static.sha256
            dist/nc-arm32-softfp-static.tar.gz
          retention-days: 30
